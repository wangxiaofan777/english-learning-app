# HTTP：只保留探活与到 HTTPS 的跳转
server {
  listen 80;
  server_name _;

  # 容器 healthcheck 探活端点（不跳转）
  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  location / {
    # $http_host 保留客户端访问的端口：443 部署与 8443 等非标准端口映射下跳转都正确
    return 301 https://$http_host$request_uri;
  }
}

# HTTPS：业务入口。证书默认为 scripts/gen_certs.sh 生成的自签名证书，
# 正式上线时替换 ./certs/fullchain.pem 与 ./certs/privkey.pem 为 CA 签发证书即可
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  root /usr/share/nginx/html;
  index index.html;

  # H5 hash 路由，兜底回 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 后端 API 反代；关闭缓冲以支持对话 SSE 流式
  location /api/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_set_header Connection "";
  }
}
