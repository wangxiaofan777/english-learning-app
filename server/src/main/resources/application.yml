server:
  port: 8080

spring:
  application:
    name: lingo-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  # 本地私密配置（LLM api-key 等）：从启动目录下 config/local.yml 读取，
  # 该文件优先级高于环境变量占位符；文件里没写的键仍回落到环境变量
  config:
    import: "optional:file:./config/local.yml"
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

lingo:
  # 安全密钥必须显式提供（环境变量或 config/local.yml），无默认值——缺失时启动失败
  jwt-secret: ${JWT_SECRET:}
  admin-token: ${ADMIN_TOKEN:}
  guest-enabled: ${GUEST_ENABLED:true}
  wx-dev-fallback: ${WX_DEV_FALLBACK:false}
  llm-mock-allowed: ${LLM_MOCK_ALLOWED:false}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  wx:
    # 留空且未开启 wx-dev-fallback 时，微信登录直接报「未配置」
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
  llm:
    # 留空时对话走内置 Mock；配置后经 LangChain4j（OpenAI 兼容）调用真实模型
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: 0.7

---
# 默认：PostgreSQL（docker-compose 提供）
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lingo}
    username: ${DB_USER:lingo}
    password: ${DB_PASSWORD:lingo123}

---
# 本地快速体验：内存 H2，无需 Docker（放宽安全开关，生产 postgres profile 不受影响）
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:lingo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

lingo:
  jwt-secret: ${JWT_SECRET:local-h2-dev-secret-key-32-bytes-minimum-padding!!}
  wx-dev-fallback: true
  llm-mock-allowed: true
