# 生产部署：所有敏感配置走 .env（缺一项都会 fail-fast，不会带默认凭据启动）
services:
  postgres:
    image: postgres:16-alpine
    container_name: talkbuddy-postgres
    environment:
      POSTGRES_DB: lingo
      POSTGRES_USER: lingo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    # 数据库不对宿主机暴露端口，仅在 compose 内网访问
    volumes:
      - lingo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  server:
    build: ./server
    container_name: talkbuddy-server
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: lingo
      DB_USER: lingo
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required in .env}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required in .env}
      LLM_MODEL: ${LLM_MODEL:-qwen-flash}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env (>=32 random bytes)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required in .env}
      GUEST_ENABLED: ${GUEST_ENABLED:-true}
      WX_DEV_FALLBACK: ${WX_DEV_FALLBACK:-false}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    # 仅内网可达：对外统一走 web 容器的 nginx（/api/ 反代）
    volumes:
      - lingo-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  web:
    build: ./app
    container_name: talkbuddy-web
    depends_on:
      server:
        condition: service_healthy
    # 80 只做跳转与探活，业务流量走 443 TLS；证书由 scripts/gen_certs.sh 生成或替换为正式证书
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  # 独立管理后台（与用户端完全分离）：默认只绑定宿主机回环地址，
  # 远程访问用 SSH 隧道：ssh -L 8089:127.0.0.1:8089 <host> 后打开 https://127.0.0.1:8089
  # （隧道走 80 跳转 443，需同时 -L 8444:127.0.0.1:8444；或临时改为映射 8444）
  # 确需公网直接访问时改为 "8089:80" / "8444:443"，并自行收紧防火墙、更换管理域名的正式证书
  admin:
    build: ./admin
    container_name: talkbuddy-admin
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:80"
      - "127.0.0.1:8444:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  lingo-pgdata:
  lingo-logs:
